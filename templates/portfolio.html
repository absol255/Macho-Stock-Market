<!DOCTYPE html>
<html>
<head>
    <title>Portfolio — Macho Stock Market</title>

    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/navigation.css">
    <link rel="stylesheet" href="/static/css/buttons.css">
</head>
<body>

    <div class="hero">
        <h1 id="logo">MACHO STOCK MARKET</h1>
    </div>

    <nav>
        <a class="nav" href="/">Home</a>
        <a class="nav" href="/portfolio">Buy Stocks</a>
        <a class="nav" href="/admin">Admin Panel</a>
    </nav>

    <div class="container">
        <div class="card" id="signin-card">
            <h2>Portfolio</h2>
            <p>Sign in with your username and bank account number.</p>
            <input type="text" id="username" placeholder="Username" maxlength="64" autocomplete="username">
            <input type="text" id="bankaccnum" placeholder="Bank account number" inputmode="numeric" autocomplete="off">
            <button class="button" id="signin-btn" type="button">Sign In</button>
            <p id="signin-msg"></p>
        </div>

        <div class="card" id="trade-card" style="display:none">
            <h2 id="user-name"></h2>
            <p>Bank account: <span id="bank-display"></span></p>
            <p>Macho bucks: <span class="balance" id="balance">0</span></p>

            <h3>Your holdings</h3>
            <div id="holdings-list"></div>

            <h3>Buy stock</h3>
            <select id="buy-stock"></select>
            <input type="number" id="buy-qty" min="1" value="1" placeholder="Quantity">
            <button class="button" id="buy-btn" type="button">Buy</button>
            <br />
            <h3>Sell stock</h3>
            <select id="sell-stock" class="button" style="max-width: max-content; max-height: max-content;"></select>
            <input type="number" id="sell-qty" min="1" value="1" placeholder="Quantity">
            <button class="button" id="sell-btn" type="button">Sell</button>
            <p id="trade-msg"></p>
            <button class="button" id="logout-btn" type="button">Sign Out</button>
        </div>
    </div>

    <script src="/static/js/portfolio.js"></script>

</body>
</html>
